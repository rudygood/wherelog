# WhereLog — Codemagic unsigned iOS build (free route, for AltServer)
#
# DRAFT prepared 2026-11-06 for Rudy's iPhone smoke test (scheduled today).
# Place this file at the root of the WhereLog repository as `codemagic.yaml`
# and commit it. Codemagic detects it automatically; the Workflow Editor
# configuration is ignored once it exists.
#
# What it does:
#   - Builds the app unsigned (no Apple Developer membership needed).
#   - Packages the resulting .app into an unsigned .ipa (Payload/Runner.app),
#     which is the file AltServer on the Spectre installs and re-signs
#     under Rudy's free Apple ID.
# What it does NOT do: sign the app for distribution, or publish
# anywhere. No secrets, no certificates, no App Store Connect key
# are involved in this workflow. (The packaging step does AD-HOC
# sign the finished .app and its Share Extension — no identity,
# purely so each binary's signature carries its entitlements.
# AltStore reads an app's declared App Group from the signature's
# entitlements at install time; a never-signed binary declares
# nothing, so AltStore granted no group and the share container
# never existed on the phone — diagnosed 2026-11-10.)
#
# Source: Codemagic docs, "Flutter apps" (docs.codemagic.io),
# "To build an unsigned .app version for debug, replace the build command
# with: flutter build ios --debug --no-codesign".
# Note: an unsigned build produces a .app, not an .ipa — the packaging
# step below is what turns it into the .ipa AltServer expects.
#
# Before the first build, the repo must exist on a host Codemagic can
# reach (private GitHub repo). The WhereLog git in Muse's workspace
# currently has NO remote — pushing it to a private repo is a session
# step only Rudy can do from his own GitHub account.

workflows:
  wherelog-ios-unsigned:
    name: WhereLog iOS (unsigned, for AltServer)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Install pods
        script: |
          find . -name "Podfile" -execdir pod install \;
      - name: Build iOS unsigned (release, no codesign)
        script: |
          # Release (not debug) so there is no debug banner and the
          # rendering matches a real install. If this fails, fall back
          # to the exact Codemagic-documented command:
          #   flutter build ios --debug --no-codesign
          flutter build ios --release --no-codesign
      - name: Package .app as unsigned .ipa for AltServer
        script: |
          set -e
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          # Ad-hoc sign, inside-out (extension first, then the app),
          # embedding each target's entitlements in its signature so
          # AltStore can see and grant the App Group at install.
          for appex in Payload/Runner.app/PlugIns/*.appex; do
            codesign --force --sign - --timestamp=none \
              --entitlements "ios/Share Extension/Share Extension.entitlements" \
              "$appex"
          done
          codesign --force --sign - --timestamp=none \
            --entitlements ios/Runner/Runner.entitlements \
            Payload/Runner.app
          # Leave proof in the build log that the group is embedded.
          codesign -d --entitlements - Payload/Runner.app 2>&1 | grep -A2 application-groups || true
          zip -r wherelog-unsigned.ipa Payload
          rm -rf Payload
    artifacts:
      - wherelog-unsigned.ipa
      - /tmp/xcodebuild_logs/*.log
